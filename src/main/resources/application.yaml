spring:
  application:
    name: short-url-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:shorturl;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  counter-block-size: ${COUNTER_BLOCK_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework
